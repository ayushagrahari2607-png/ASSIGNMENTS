
<!DOCTYPE html>
<html lang="en">
<head>
    <title>Student Admission</title>
</head>
<body>

    <table width="100%" bgcolor="blue">
        <tr>
            <td align="center">
                <font color="white">
                    <h1>ABC College Admission 2026</h1>
                </font>
            </td>
        </tr>
    </table>

    <h2 align="center">Courses and Fees</h2>

    <table border="1" align="center"
           cellpadding="5" width="70%">

        <caption>Available Courses</caption>

        <tr bgcolor="lavender">
            <th>Course</th>
            <th>Seats</th>
            <th>Fees</th>
        </tr>

        <tr>
            <td>B.Tech CSE</td>
            <td>120</td>
            <td>&#8377;90,000</td>
        </tr>

        <tr>
            <td>BCA</td>
            <td>60</td>
            <td>&#8377;45,000</td>
        </tr>

    </table>

    <br>

    <form>
        <fieldset>
            <legend>Application Form</legend>

            <label for="name">Name:</label>
            <br>
            <input type="text" id="name" required>

            <br><br>

            <label for="email">Email:</label>
            <br>
            <input type="email" id="email" required>

            <br><br>

            <label for="course">Course:</label>
            <br>
            <select id="course">
                <option>B.Tech CSE</option>
                <option>BCA</option>
            </select>

            <br><br>

            <label for="statement">Statement:</label>
            <br>
            <textarea id="statement" rows="5" cols="40"></textarea>

            <br><br>

            <input type="submit" value="Apply">
        </fieldset>
    </form>

    <br>

    <table width="100%" bgcolor="blue">
        <tr>
            <td align="center">
                <font color="white">
                    <p>&copy; 2026 ABC College</p>
                </font>
            </td>
        </tr>
    </table>

</body>
</html>
