<!DOCTYPE html>
<html>
<head>
    <title>Form Validation</title>
</head>
<body>

    <form action="submit.php" method="post">

        <input type="text"
               name="name"
               placeholder="Full name"
              >
        <br><br>

        <input type="email"
               name="email"
               placeholder="you@college.edu"
              >
        <br><br>

        <input type="text"
               name="mobile"
               placeholder="10-digit mobile"
              >
        <br><br>

        <input type="password"
               name="password"
                 placeholder="Min 6 characters"
              >
        <br><br>

        <input type="number"
               name="age"
               placeholder="Age (17+)"
               >
        <br><br>

        <input type="submit" value="Register">

    </form>

</body>
</html>
